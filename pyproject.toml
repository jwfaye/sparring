[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sparring"
version = "0.1.0"
description = "Training partner for data science / ML engineer technical tests and interviews"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["anthropic~=2.3"]
check = ["pandas==2.2.3", "numpy==2.0.2"]
dev = ["pytest~=9.2", "ruff~=0.15.4", "mypy~=2.4"]

[tool.setuptools]
packages = ["backend", "tools"]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["tools/sources"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^\\.venv/", "^\\.venv-check/", "^tools/sources/"]

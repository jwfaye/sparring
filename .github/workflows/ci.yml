name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the run in progress. Pull request
# runs are cancelled; runs on main are left to finish so every commit on main
# keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The check extra pins pandas and numpy to the Pyodide versions.
          # numpy 2.0.2 has no wheel for Python 3.13, so that leg installs the
          # same pandas with the closest numpy that has one.
          # Only the 3.12 leg measures coverage: it fails under the
          # fail_under floor of pyproject.toml and uploads coverage.xml.
          - python-version: "3.12"
            extras: "check,dev"
            pins: ""
            pytest-options: "--cov --cov-report=term-missing --cov-report=xml"
          - python-version: "3.13"
            extras: "dev"
            pins: "pandas==2.2.3 numpy~=2.1.0"
            pytest-options: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[${{ matrix.extras }}]" ${{ matrix.pins }}
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: python -m mypy .
      - name: Tests (includes the bank checkers; the browser suite is excluded by addopts and has its own job)
        run: python -m pytest -q ${{ matrix.pytest-options }}
      - name: Upload the coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # The one check branch protection and repoach require. It fails when any
  # leg of the matrix failed, was cancelled or was skipped.
  test:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every Python leg passed
        run: |
          echo "unit matrix result: ${{ needs.unit.result }}"
          test "${{ needs.unit.result }}" = "success"

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install ESLint
        run: npm ci
      - name: Lint app/js
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (check, dev and e2e extras)
        run: python -m pip install -e ".[check,dev,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install axe-core (injected by tests/e2e/test_a11y.py)
        run: npm ci
      - name: Browser tests (headless Chromium against a local server.py)
        run: python -m pytest -q -m e2e tests/e2e

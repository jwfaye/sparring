name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (check extra = pandas/numpy pinned to the Pyodide versions)
        run: python -m pip install -e ".[check,dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: python -m mypy .
      - name: Tests (includes the bank checkers)
        run: python -m pytest -q

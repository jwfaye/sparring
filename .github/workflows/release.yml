name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches project.version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compare the tag with project.version in pyproject.toml
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project.version $project_version in pyproject.toml"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches project.version $project_version"

  build:
    name: Build sdist and wheel
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel from the tagged tree
        run: |
          python -m pip install --require-hashes -r .github/release-requirements.txt
          python -m build --no-isolation
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
      - name: Check that the wheel installs and imports outside the source tree
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import server, backend"

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            BEGIN { gsub(/\./, "\\.", version); heading = "^## \\[" version "\\]" }
            /^## / { printing = ($0 ~ heading); next }
            /^\[[^]]+\]: / { printing = 0 }
            printing { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section '## [$version]' for tag $GITHUB_REF_NAME"
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

# The release job runs in the "release" environment: protection rules set on
# it in the repository settings (required reviewers, deployment branches and
# tags limited to v*) gate the only job that writes to the repository.
#
# Publishing to PyPI is not set up. To add it: register this repository and
# workflow as a trusted publisher of the project on pypi.org, then add a job
# that needs build, declares permissions id-token: write, downloads the dist
# artifact and runs pypa/gh-action-pypi-publish pinned to a commit SHA.
